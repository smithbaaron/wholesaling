# Alembic configuration. The database URL is NOT set here: wholesaling/db/migrations/env.py reads
# DATABASE_URL via wholesaling.config.settings (override with `-x url=...`).
[alembic]
script_location = %(here)s/wholesaling/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os
path_separator = os
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
