# CI for the wholesaling system (REQUIREMENTS.md BO-01, BO-18, BO-19, ENG-Q4).
#
# Three jobs, none of which needs a secret:
#   lint-type-test  ruff check, ruff format --check, mypy --strict, pytest (SQLite in memory) + coverage
#   postgres        the same suite against a Postgres 16 service container, plus the `postgres`-marked tests
#   docker          builds the production image to prove the Dockerfile stays valid (no push)
#
# Every integration runs in mock mode in CI (RUL-01, RUL-02). Tests marked `temporal` download the
# Temporal time-skipping test server on first run; they run in the first job with no extra services.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # read for checkout; write only to post a commit comment with the pytest log on failure

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the COPY --from=ghcr.io/astral-sh/uv:<version> line in the Dockerfile.
  UV_VERSION: "0.13.5"
  PYTHON_VERSION: "3.12"
  # Settings defaults are already mock everywhere; these make the intent explicit in CI logs.
  APP_ENV: test
  MODEL_PROVIDER: mock
  GRAPH_MODE: mock
  SHEETS_MODE: mock
  DOCUSIGN_MODE: mock
  TEMPORAL_MODE: mock
  SMS_MODE: "off"

jobs:
  lint-type-test:
    name: Lint, type-check, unit tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: Pytest with coverage
        run: >
          uv run pytest
          --cov=wholesaling --cov-report=term-missing --cov-report=xml:coverage.xml
          -q -rA 2>&1 | tee pytest.log; exit "${PIPESTATUS[0]}"

      - name: Post pytest log on the commit when tests fail
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CI pytest failed on ${GITHUB_SHA} (${GITHUB_RUN_ID})."
            echo '```'
            awk '/^=+ (FAILURES|ERRORS) =+/,/^=+ (short test summary|warnings summary)/' pytest.log | head -c 50000
            echo
            echo '--- summary ---'
            grep -E '^(FAILED|ERROR) ' pytest.log | head -n 50
            tail -n 3 pytest.log
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sqlite
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  postgres:
    name: Tests against Postgres 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-type-test
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for a container that lives only for this job. Not a secret.
          POSTGRES_USER: wholesaling
          POSTGRES_PASSWORD: wholesaling
          POSTGRES_DB: wholesaling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wholesaling -d wholesaling_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://wholesaling:wholesaling@localhost:5432/wholesaling_test
      DATABASE_URL: postgresql+asyncpg://wholesaling:wholesaling@localhost:5432/wholesaling_test
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Full suite on Postgres (conftest switches the engine when TEST_DATABASE_URL is set)
        run: uv run pytest -q -rA 2>&1 | tee pytest.log; exit "${PIPESTATUS[0]}"

      - name: Post pytest log on the commit when tests fail
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CI (Postgres job) pytest failed on ${GITHUB_SHA} (${GITHUB_RUN_ID})."
            echo '```'
            awk '/^=+ (FAILURES|ERRORS) =+/,/^=+ (short test summary|warnings summary)/' pytest.log | head -c 50000
            echo
            echo '--- summary ---'
            grep -E '^(FAILED|ERROR) ' pytest.log | head -n 50
            tail -n 3 pytest.log
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md || true

      - name: Postgres-only tests
        # Exit code 5 means "no tests collected": acceptable until BO-02 adds the first
        # `postgres`-marked tests, a failure (1) is not.
        run: uv run pytest -m postgres -q || test $? -eq 5

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: wholesaling:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image smoke test
        # The entry-point modules land in BO-03; until then we only prove the venv and the
        # console scripts are installed and importable by the non-root user.
        run: |
          docker run --rm --entrypoint sh wholesaling:ci -c '
            set -eu
            test "$(id -u)" = "10001"
            python -c "import wholesaling, sys; print(wholesaling.__version__); sys.exit(0)"
            test -x /app/.venv/bin/wholesaling-api
            test -x /app/.venv/bin/wholesaling-worker
          '
